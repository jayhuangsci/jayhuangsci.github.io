<!DOCTYPE html>
<html lang="{{ .Site.Language.LanguageCode }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="site-shell">
    {{ partial "header.html" . }}

    <div class="site-body">
      <main id="main-content" class="site-main" tabindex="-1">
        {{ block "main" . }}{{ end }}
      </main>

      {{ partial "footer.html" . }}
    </div>
    <div class="drawer-backdrop" aria-hidden="true" hidden></div>
  </div>

  <script type="module" src="{{ "js/site-drawer.js" | relURL }}"></script>
  {{ partial "mermaid.html" . }}
</body>
</html>
